<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposição - Vídeo em Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
            overflow: hidden;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* O iframe ocupa toda a tela e desativa a interação do ponteiro do mouse no YouTube */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            pointer-events: none;
        }

        /* Camada inicial para colocar em tela cheia se necessário */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            font-family: sans-serif;
        }

        #start-overlay button {
            padding: 16px 32px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Overlay de acionamento inicial -->
    <div id="start-overlay" onclick="iniciarExposicao()">
        <button>Iniciar Exposição</button>
    </div>

    <!-- Player do seu vídeo no YouTube (ID: VUekWwNjqRY) em Loop e sem controles -->
    <iframe 
        id="ytPlayer"
        src="https://www.youtube.com/embed/VUekWwNjqRY?autoplay=1&controls=0&loop=1&playlist=VUekWwNjqRY&rel=0&modestbranding=1&playsinline=1" 
        allow="autoplay; encrypted-media">
    </iframe>

    <script>
        function iniciarExposicao() {
            // Força o modo de tela cheia no navegador
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            // Esconde a tela cinza/preta inicial
            document.getElementById('start-overlay').style.display = 'none';
        }

        // Bloqueia menu do botão direito do mouse
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Bloqueia teclas de barra de espaço, setas e atalhos de navegação
        document.addEventListener('keydown', e => {
            e.preventDefault();
            return false;
        });
    </script>
</body>
</html>
