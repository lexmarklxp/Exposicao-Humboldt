<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposição - Vídeo em Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
            overflow: hidden;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Vídeo ocupa a tela toda e esconde o ponteiro do mouse */
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Use 'cover' se quiser preencher sem bordas pretas laterais */
            cursor: none;
        }

        /* Camada para iniciar em tela cheia na primeira interação (se necessário) */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            font-family: sans-serif;
        }

        #start-overlay button {
            padding: 16px 32px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Overlay de acionamento inicial -->
    <div id="start-overlay" onclick="iniciarExposicao()">
        <button>Iniciar Exposição em Tela Cheia</button>
    </div>

    <!-- Player sem controles e com a propriedade loop -->
    <video id="videoPlayer" loop playsinline preload="auto">
        <source src="neymar.mp4" type="video/mp4">
        Navegador incompatível.
    </video>

    <script>
        const player = document.getElementById('videoPlayer');
        const overlay = document.getElementById('start-overlay');

        function iniciarExposicao() {
            // 1. Entra em Tela Cheia
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            // 2. Oculta o botão e toca o vídeo
            overlay.style.display = 'none';
            player.play();
        }

        // Tenta rodar automaticamente caso o Chromebook ligue direto em Quiosque
        window.addEventListener('load', () => {
            player.play().then(() => {
                overlay.style.display = 'none';
            }).catch(() => {
                // Caso o navegador exija um clique para permitir áudio, mantém o botão visível
            });
        });

        // Reforço via código para garantir o Loop sem interrupções
        player.onended = function() {
            player.currentTime = 0;
            player.play();
        };

        // Bloqueia menu de botão direito do mouse
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Bloqueia teclas de pausa (Espaço, K), controle de mídia e atalhos
        document.addEventListener('keydown', e => {
            e.preventDefault();
            return false;
        });

        // Impede que o clique no vídeo altere o estado (play/pause)
        player.addEventListener('click', e => e.preventDefault());
    </script>
</body>
</html>
